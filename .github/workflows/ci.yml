name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # skills-ref is the agent skills reference validator (anthropics/agentskills);
      # the PyPI package ships its CLI as `agentskills`.
      - run: uvx --from skills-ref==0.1.1 agentskills validate assess
      - run: python3 -I scripts/check_drift.py
      - run: python3 -I scripts/test_check_bundle.py
      - run: python3 -I scripts/test_feedback_guard.py
